add_newline = false
format = """
$time\
$python\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$cmd_duration\
$character
"""

[package]
disabled = true

[line_break]
disabled = false

[time]
disabled = false
time_format = "%T"
format = "[$time]($style) | "

[cmd_duration]
format = "[$duration]($style) "

[python]
format = '[🐍 $virtualenv]($style) | '
style = "yellow bold"